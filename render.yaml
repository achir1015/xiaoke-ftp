# Render 部署設定（Blueprint）：小柯機器人FTP助手線上版的轉接伺服器
# 在 Render 按 New → Blueprint，選這個 GitHub 程式庫就會照這裡建立；之後推到 main 會自動更新
services:
  - type: web
    name: xiaoke-ftp-relay
    runtime: node
    plan: free
    region: singapore          # 離台灣最近
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node server/index.js
    healthCheckPath: /
    autoDeploy: true
    buildFilter:
      paths: ['server/**', 'src/main/drivers/**', 'package.json', 'package-lock.json', 'render.yaml']
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 存取密碼：建立時 Render 會請您輸入；線上版第一次連線時輸入同一組密碼
      - key: XKFTP_PASSWORD
        sync: false
      - key: XKFTP_ORIGINS
        value: https://achir1015.github.io
