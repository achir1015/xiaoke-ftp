name: XiaokeFTP
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"   # Citadel（SFTP）要 macOS 14 以上
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.9.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "10200"
targets:
  XiaokeFTP:
    type: application
    platform: iOS
    sources:
      - path: XiaokeFTP
      - path: web            # 和 Android 版同一份手機版網頁（sync.sh 從 ../mobile/www 複製進來）
        type: folder
    dependencies:
      - package: Citadel     # SFTP（SSH）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokeftp
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad；Mac 版是下面的 XiaokeFTPMac
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program（個人）
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaokeFTP/Info.plist
      properties:
        CFBundleDisplayName: 小柯FTP助手
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # SFTP 用標準加密演算法、不在法國上架 → App Store Connect 判定免出口申報（2026-11-11）
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        # iPhone 直放；iPad 四個方向（橫放時左右兩個窗格並排）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 連線到任何 FTP／WebDAV 主機（含 http 與家裡的 NAS）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 連線到家裡或公司區域網路裡的 NAS、FTP 主機需要使用區域網路。
        NSPhotoLibraryUsageDescription: 從照片匯入相片、影片，再上傳到主機。
        # 「檔案」App 裡看得到小柯FTP助手的資料夾（下載的檔案都在這裡）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  # Mac App Store 版：原生 macOS App（Apple 晶片＋Intel），共用 XiaokeFTP 裡的連線與檔案程式，畫面用電腦版版面
  XiaokeFTPMac:
    type: application
    platform: macOS
    sources:
      - path: XiaokeFTP
        excludes:
          - XiaokeFTPApp.swift
          - NativeIOS.swift
          - Assets.xcassets
          - Info.plist
      - path: Mac
        excludes:
          - Info.plist
      - path: web
        type: folder
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_NAME: 小柯機器人FTP助手      # 「應用程式」資料夾裡顯示的名稱
        PRODUCT_MODULE_NAME: XiaokeFTPMac
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokeftp   # 和 iPhone／iPad 版同一個 Bundle ID：App Store 同一個項目
        ARCHS: "$(ARCHS_STANDARD)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP
        CODE_SIGN_ENTITLEMENTS: Mac/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: 小柯機器人FTP助手
        CFBundleName: 小柯機器人FTP助手
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 YU-JUH WU
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
schemes:
  XiaokeFTP:
    build:
      targets:
        XiaokeFTP: all
    run:
      config: Debug
    archive:
      config: Release
  XiaokeFTPMac:
    build:
      targets:
        XiaokeFTPMac: all
    run:
      config: Debug
    archive:
      config: Release
