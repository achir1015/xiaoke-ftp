name: XiaokeFTP
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.9.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "10200"
targets:
  XiaokeFTP:
    type: application
    platform: iOS
    sources:
      - path: XiaokeFTP
      - path: web            # 和 Android 版同一份手機版網頁（sync.sh 從 ../mobile/www 複製進來）
        type: folder
    dependencies:
      - package: Citadel     # SFTP（SSH）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokeftp
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program（個人）
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaokeFTP/Info.plist
      properties:
        CFBundleDisplayName: 小柯FTP助手
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        # iPhone 直放；iPad 四個方向（橫放時左右兩個窗格並排）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 連線到任何 FTP／WebDAV 主機（含 http 與家裡的 NAS）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 連線到家裡或公司區域網路裡的 NAS、FTP 主機需要使用區域網路。
        NSPhotoLibraryUsageDescription: 從照片匯入相片、影片，再上傳到主機。
        # 「檔案」App 裡看得到小柯FTP助手的資料夾（下載的檔案都在這裡）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  XiaokeFTP:
    build:
      targets:
        XiaokeFTP: all
    run:
      config: Debug
    archive:
      config: Release
